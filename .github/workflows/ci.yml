name: CI (build)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Run cppcheck
        # Retried: the first pio invocation on a fresh runner makes PlatformIO populate its
        # internal penv with Python deps, a step that occasionally flakes on network/pip
        # ("Failed to install Python dependencies into penv"). Real cppcheck defects still
        # fail (after the retries), just never a transient penv install.
        run: |
          set -uo pipefail
          attempt=1; max=3
          while true; do
            if pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high; then
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::pio check failed after $attempt attempts"; exit 1
            fi
            echo "::warning::pio check attempt $attempt failed (possibly transient penv/pip); retrying in 15s"
            attempt=$((attempt + 1)); sleep 15
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build ECHO
        # Retried for the same reason as cppcheck: the transient "Failed to install Python
        # dependencies into penv" happens during PlatformIO's first-run setup, before any
        # compilation. A real compile error still fails after the retries.
        run: |
          set -uo pipefail
          attempt=1; max=3
          while true; do
            if pio run -e echo_x3 -e echo_x4 2>&1 | tee pio.log; then
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::pio run failed after $attempt attempts"; exit 1
            fi
            echo "::warning::pio run attempt $attempt failed (possibly transient penv/pip); retrying in 15s"
            attempt=$((attempt + 1)); sleep 15
          done

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## Firmware build stats"
            grep -E "RAM:\s|Flash:\s" pio.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            .pio/build/echo_x3/firmware-echo_x3.bin
            .pio/build/echo_x4/firmware-echo_x4.bin
          if-no-files-found: error

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
