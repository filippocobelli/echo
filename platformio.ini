[platformio]
default_envs = echo_x3
extra_configs = platformio.local.ini

[crosspoint]
version = 1.3.0
upstream_base = 1.3.1

[echo]
version = 1.0.1
upstream_base = 1.3.1
version_code = 2026093001

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_websockets.py
  post:scripts/rename_firmware.py

lib_ignore =
  HalClockSim

; Libraries
lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes current branch)
  -DECHO_VERSION=\"${crosspoint.upstream_base}\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"tiny\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT

[env:debug]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION and ECHO_VERSION injected by scripts/git_branch.py
  ; (uses $CROSSPOINT_RC_HASH env var in CI, or git short hash locally)
  -DCROSSPOINT_FIRMWARE_VARIANT=\"tiny\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT

[env:test]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION and ECHO_VERSION injected by scripts/git_branch.py
  ; (uses $CROSSPOINT_RC_HASH env var in CI, or git short hash locally)
  -DCROSSPOINT_FIRMWARE_VARIANT=\"tiny\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT

; Omits Extra Large (18px) and Huge (20px) but includes Teensy/Tiny/Small font sizes and emoji support.
[env:tiny]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DECHO_VERSION=\"${crosspoint.upstream_base}-tiny\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"tiny\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT

; Omits smaller font sizes (8px, 10px, and 12px) to support Extra Large/Huge and emojis.
[env:xlarge]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DECHO_VERSION=\"${crosspoint.upstream_base}-xlarge\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"xlarge\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DOMIT_TEENSY_FONT
  -DOMIT_TINY_FONT
  -DOMIT_SMALL_FONT

; Includes all font sizes but without Emoji support (smallest build size with all font sizes)
[env:no_emoji]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DECHO_VERSION=\"${crosspoint.upstream_base}-no_emoji\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"no_emoji\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DOMIT_EMOJI_FONTS
  -DOMIT_HUGE_FONT

; ECHO firmware builds
[env:echo_x3]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${echo.version}\"
  -DECHO_VERSION=\"${echo.version}\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"echo_x3\"
  ; Lexend Deca ships as an SD card family instead of built-in (~748 KB of flash).
  -DOMIT_LEXENDDECA_FONT
  -DECHO_VERSION_CODE=${echo.version_code}
  -DECHO_VERSION_CODE_STR=\"${echo.version_code}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT
  -DOMIT_TEENSY_FONT
  -DOMIT_ITTY_BITTY_FONT

[env:echo_x4]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${echo.version}\"
  -DECHO_VERSION=\"${echo.version}\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"echo_x4\"
  ; Lexend Deca ships as an SD card family instead of built-in (~748 KB of flash).
  -DOMIT_LEXENDDECA_FONT
  -DECHO_VERSION_CODE=${echo.version_code}
  -DECHO_VERSION_CODE_STR=\"${echo.version_code}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT
  -DOMIT_TEENSY_FONT
  -DOMIT_ITTY_BITTY_FONT

[env:simulator]
platform = native
custom_run_simulator_target_owner = project
lib_compat_mode = off
build_src_filter =
  +<*>
  -<network/CrossPointWebServer.cpp>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<network/WebDAVHandler.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -Wno-c++11-narrowing
  -DSIMULATOR
  -DCROSSPOINT_VERSION=\"sim\"
  -DECHO_VERSION=\"${echo.version}\"
  -DECHO_VERSION_CODE=${echo.version_code}
  -DECHO_VERSION_CODE_STR=\"${echo.version_code}\"
  ; The simulator's OTA stub keys the cancellable installUpdate() signature on this macro.
  -DCROSSINK_VERSION=\"sim\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  ;-DSIMULATOR_DEVICE_X3 ; uncomment to simulate X3 screen size
  -Isrc
  ;-DOMIT_ITTY_BITTY_FONT ; uncomment to omit itty bitty (9px) font size
  -DCROSSPOINT_SIM_USE_NATIVE_DECODERS
  -Dmemcpy_P=memcpy ; For native JPEGDEC
lib_ignore = hal, WebSockets
extra_scripts =
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_html.py
  post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  ; Pinned: upstream HEAD tracks CrossPoint develop and breaks this fork's HAL
  ; (e39eab5 changed verifyPowerButtonWakeup to take no arguments).
  simulator=https://github.com/uxjulia/crosspoint-simulator.git#09e28c90502226c671997574d3906a2d7d51796a
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b

; Same simulator, but with the X3 screen (528x792). Needed to check layouts on the primary device.
[env:simulator_x3]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_X3
